package dev.potatoauth;

import net.fabricmc.api.ClientModInitializer;
import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
import net.fabricmc.fabric.api.client.keymapping.v1.KeyMappingHelper;
import net.minecraft.client.KeyMapping;
import net.minecraft.network.chat.Component;
import com.mojang.blaze3d.platform.InputConstants;

public class PotatoAuthClient implements ClientModInitializer {
    private static KeyMapping openMenuKey;

    @Override
    public void onInitializeClient() {
        KeyMapping.Category category =
            KeyMapping.Category.register(
                net.minecraft.resources.ResourceLocation.fromNamespaceAndPath(
                    "potatoauth", "main"
                )
            );

        openMenuKey = KeyMappingHelper.registerKeyMapping(
            new KeyMapping(
                "key.potatoauth.open_menu",
                InputConstants.Type.KEYSYM,
                InputConstants.KEY_RIGHT_SHIFT,
                category
            )
        );

        ClientTickEvents.END_CLIENT_TICK.register(client -> {
            while (openMenuKey.consumeClick()) {
                if (client.player != null) {
                    client.player.sendSystemMessage(
                        Component.literal("§5PotatoAuth §7is running!")
                    );
                }
            }
        });
    }
}
